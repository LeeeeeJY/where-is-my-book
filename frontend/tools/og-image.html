<!doctype html>
<!--
  공유 링크 미리보기에 쓰는 그림(`public/og.png`)의 원본입니다.

  **그림만 저장소에 두면 아무도 고치지 못합니다.** 색이나 문구를 바꿔야 할 때 원본이
  없으면 손댈 수 없는 그림이 하나 남습니다. 그래서 만드는 방법을 코드로 남깁니다.

  다시 만들려면 `frontend/` 에서:

    node tools/make-og-image.mjs

  **크로미움을 직접 부르지 마세요.** 헤드리스 크로미움은 요청한 창 높이보다 85px 적게
  그리면서 남는 자리를 배경색으로 채워 내놓습니다. 잘렸다는 것이 눈에 띄지 않아서
  아래쪽에 둔 것이 조용히 사라집니다. 그 보정이 스크립트에 들어 있습니다.

  글꼴은 시스템에 있는 것을 씁니다. 한글 글꼴이 없는 기계에서 만들면 글자가 네모로
  나오므로, 만든 뒤 반드시 눈으로 확인하세요.

  도형은 `src/components/Brand.tsx` 및 `public/favicon.svg` 와 같은 좌표입니다.
  한쪽만 고치면 어긋납니다.
-->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      @page { size: 1200px 630px; margin: 0; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        width: 1200px;
        height: 630px;
        background: #fbfaf8;
        color: #23201c;
        font-family: 'Pretendard', 'Noto Sans KR', 'Noto Sans KR Thin', 'Apple SD Gothic Neo',
          sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 88px;
        overflow: hidden;
        /* 아래쪽 띠 하나로 강조색을 넣습니다. 큰 면을 칠하면 카드에서 글자가 묻힙니다. */
        border-bottom: 14px solid #2f6f4f;
      }
      .brand { display: flex; align-items: center; gap: 24px; }
      .title { margin: 0; font-size: 92px; font-weight: 700; letter-spacing: 0.01em; }
      .name { margin: 14px 0 0; font-size: 34px; font-weight: 500; color: #77716a; }
      .tagline {
        margin: 44px 0 0;
        font-size: 40px;
        font-weight: 500;
        line-height: 1.5;
        max-width: 950px;
      }
      .tagline b { color: #2f6f4f; font-weight: 700; }
      .foot { margin: 40px 0 0; font-size: 26px; color: #77716a; }
    </style>
  </head>
  <body>
    <div class="brand">
      <svg width="112" height="112" viewBox="0 0 24 24" aria-hidden="true">
        <rect fill="#cdc6bb" x="4.4" y="8.6" width="4.6" height="10.8" rx="1" />
        <rect fill="#2f6f4f" x="9.7" y="5.4" width="4.6" height="14" rx="1" />
        <rect fill="#cdc6bb" x="15.2" y="7.6" width="4.6" height="11.8" rx="1"
              transform="rotate(13 17.5 19.4)" />
        <rect fill="#a8a196" x="2.4" y="19.4" width="19.2" height="2" rx="1" />
      </svg>
      <div>
        <h1 class="title">WIMB</h1>
        <p class="name">Where Is My Book</p>
      </div>
    </div>

    <p class="tagline">
      자주 가는 도서관을 골라 두면,<br />
      읽고 싶은 책이 <b>그중 어디에 있는지</b> 알려 줍니다.
    </p>

    <p class="foot">전국 공공도서관 통합 검색 · 출처: 도서관 정보나루</p>
  </body>
</html>
