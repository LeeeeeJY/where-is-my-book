<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#00796b" />

    <title>도서관 책 검색 · 여러 도서관 소장 확인 | WIMB</title>
    <meta
      name="description"
      content="전국 공공도서관 책 소장을 한 번에 검색하세요. 자주 가는 도서관을 선택하면 어디에 책이 있는지 바로 확인할 수 있습니다. 한 권 검색, 여러 권 검색, 서가 둘러보기를 무료로 이용하세요."
    />

    <!--
      **정본 주소를 밝혀 둡니다.** 고른 도서관이 주소에 `libs=` 로 붙는데(공유하려고 그렇게
      해 두었습니다), 그대로 두면 도서관 조합마다 다른 주소가 되어 내용이 같은 페이지가
      끝없이 만들어집니다. 검색엔진에는 그것이 전부 중복 페이지로 보입니다.
    -->
    <link rel="canonical" href="https://where-is-my-book.vercel.app/" />

    <!-- 검색 엔진 사이트 소유권 확인 -->
    <meta name="google-site-verification" content="0PWBWB6ToMEJhAMptckEcI75i3GES3M_wJlRAwnCdYE" />
    <meta name="naver-site-verification" content="2cc841cd6c75ee252138aa25d75b23abf5aed2ce" />

    <!--
      공유 링크 미리보기.

      **이것은 검색 순위보다 실제 사용에 관한 것입니다.** 고른 도서관을 주소로 공유하는
      것이 이 도구의 기능인데, 미리보기가 없으면 카카오톡이나 슬랙에 붙였을 때 주소만
      덩그러니 남아 무엇인지 알 수 없습니다.

      **주소는 절대 경로여야 합니다.** 상대 경로를 쓰면 미리보기를 만드는 쪽에서 그림을
      찾지 못합니다. 그래서 도메인이 바뀌면 여기 네 줄(canonical, og:url, og:image,
      twitter:image)을 함께 고쳐야 합니다.

      그림은 `tools/og-image.html` 이 원본이고 `node tools/make-og-image.mjs` 로 다시
      만듭니다. 그림만 두면 나중에 아무도 고치지 못합니다.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WIMB" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://where-is-my-book.vercel.app/" />
    <meta property="og:title" content="도서관 책 검색 · 여러 도서관 소장 확인 | WIMB" />
    <meta
      property="og:description"
      content="전국 공공도서관 책 소장을 한 번에 검색하세요. 자주 가는 도서관을 선택하면 어디에 책이 있는지 바로 확인할 수 있습니다."
    />
    <meta property="og:image" content="https://where-is-my-book.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="WIMB — 자주 가는 도서관을 골라 두면 읽고 싶은 책이 그중 어디에 있는지 알려 줍니다." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="도서관 책 검색 · 여러 도서관 소장 확인 | WIMB" />
    <meta
      name="twitter:description"
      content="전국 공공도서관 책 소장을 한 번에 검색하세요. 자주 가는 도서관을 선택하면 어디에 책이 있는지 바로 확인할 수 있습니다."
    />
    <meta name="twitter:image" content="https://where-is-my-book.vercel.app/og.png" />

    <!-- JSON-LD 구조화 데이터 -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "WIMB - 도서관 책 검색, 여러 도서관 소장 확인",
      "alternateName": "WIMB",
      "url": "https://where-is-my-book.vercel.app/",
      "description": "전국 공공도서관 책 소장을 한 번에 검색하세요. 자주 가는 도서관을 선택하면 어디에 책이 있는지 바로 확인할 수 있습니다.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "KRW"
      },
      "inLanguage": "ko",
      "keywords": "도서관 책 검색, 도서관 소장 확인, 여러 도서관 검색, 공공도서관, 책 찾기, 도서관 통합 검색"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      SEO: 서비스 소개 (실제로 보임).

      **여기에 「자주 묻는 질문」 링크를 다시 두지 마세요.** 바로 위 푸터에 같은 링크가 있어서
      화면 맨 아래에 같은 단추가 둘이었습니다. 푸터 쪽 하나만 남겼습니다. 크롤러는
      사이트맵에서 그 주소를 찾습니다.
    -->
    <div id="seo-content" style="max-width: 1180px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 32px) 48px;">
      <section style="font-size: 13px; line-height: 1.65; color: #515b66;">
        <strong style="color: #15181d;">WIMB</strong>는 도서관 책 검색 서비스입니다. 
        전국 공공도서관 소장 여부를 한 번에 확인할 수 있습니다.
      </section>
    </div>
  </body>
</html>
