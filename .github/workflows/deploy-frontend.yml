# 프론트가 바뀌면 Vercel 에 배포를 걸어 줍니다.
#
# **Vercel 의 깃 연동이 조용히 멈춘 적이 있어서 만들었습니다.** 실제로 2026-09-09 새벽에
# `1e85d07` 까지는 배포가 만들어졌는데 그 뒤로 프론트를 고친 커밋 둘(`3d5f76b`, `7e69c96`)은
# 배포가 시작조차 되지 않았습니다. 빌드가 실패한 것이 아니라 목록에 아예 없었습니다.
# 그런 상태에서는 대시보드의 「Redeploy」가 **그 배포가 만들어졌던 옛 커밋을 다시 빌드**하므로
# 눌러도 화면이 그대로입니다. 실제로 그렇게 같은 커밋을 두 번 배포했습니다.
#
# **여기서 정보나루를 부르지 않습니다.** 러너 IP 는 고정되지 않아 한도가 조용히 500건으로
# 떨어지기 때문입니다(CLAUDE.md). 배포 훅을 누르는 일은 정보나루와 무관합니다.
name: 프론트 배포 걸기

on:
  push:
    branches: [main]
    # 프론트가 바뀔 때만 부릅니다. 백엔드나 문서만 고친 푸시로 배포를 돌릴 이유가 없습니다.
    paths:
      - 'frontend/**'
  # 배포가 밀렸을 때 사람이 직접 누를 수 있어야 합니다.
  workflow_dispatch:

# 푸시가 겹치면 앞의 것을 취소합니다. 배포 훅은 부를 때마다 Vercel 배포가 하나씩 생기므로
# 겹쳐 부르면 그만큼 낭비이고, 어차피 마지막 것이 최신 커밋을 빌드합니다.
concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 배포 훅 부르기
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          # **비밀이 없으면 실패시키지 않고 건너뜁니다.** 이 워크플로가 없어도 깃 연동이
          # 살아 있으면 배포는 되므로, 훅을 아직 만들지 않았다고 빌드를 빨갛게 만들 이유가
          # 없습니다. 대신 무엇을 해야 하는지 로그에 남깁니다.
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL 이 없어 건너뜁니다."
            echo "Vercel 프로젝트의 Settings -> Git -> Deploy Hooks 에서 훅을 만들고,"
            echo "저장소의 Settings -> Secrets and variables -> Actions 에 같은 이름으로 넣으세요."
            exit 0
          fi
          # 훅 주소 자체가 배포를 걸 수 있는 값이라 절대 로그에 찍지 않습니다.
          code=$(curl -sS -X POST -o response.txt -w '%{http_code}' "$HOOK")
          echo "HTTP $code"
          cat response.txt
          # 2xx 가 아니면 실패로 남겨야 합니다. 조용히 지나가면 배포가 안 걸린 것을
          # 알 방법이 없어, 화면이 예전 그대로일 때 또 코드에서 원인을 찾게 됩니다.
          case "$code" in
            2*) echo "배포를 걸었습니다." ;;
            *) echo "배포를 걸지 못했습니다."; exit 1 ;;
          esac
