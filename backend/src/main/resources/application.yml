server:
  port: 8080
  # 도서관 1,602곳을 한 번에 내보내므로 JSON 이 300KB 안팎입니다. 그대로 보내면 첫 화면에서
  # 그 시간을 사람이 기다립니다. 압축은 Spring Boot 기본값이 꺼짐이라 직접 켭니다.
  # 소장 조회 응답은 작아서 min-response-size 아래로 지나가고, 작은 응답을 압축하면
  # 오히려 손해입니다.
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2KB

spring:
  application:
    name: where-is-my-books
  threads:
    virtual:
      enabled: true   # 소장 조회가 외부 호출을 여러 번 기다리므로 가상 스레드가 유리합니다

wimb:
  data4library:
    # 키는 저장소에 두지 않습니다. .env 를 읽어 환경 변수로 넘기세요.
    auth-key: ${D4L_AUTH_KEY:}
    # 30,000 이 상한이지만 여유를 둡니다. 상한까지 쓰면 하루 마지막 조회가 실패합니다.
    daily-call-budget: 25000
    # 상대 서버에 대한 예의이자 차단을 피하는 장치입니다.
    min-request-interval-ms: 120
    # 정보나루에 동시에 나가 있을 수 있는 요청 수. 호출 하나가 3~5초 걸려서 겹치지 않으면
    # 스무 권 확인에 1분이 걸립니다. 정보나루가 느려지거나 오류를 주면 이 값을 먼저 줄이세요.
    #   WIMB_DATA4LIBRARY_MAX_IN_FLIGHT=6
    max-in-flight: 12
  opac:
    # **도서관별 OPAC 주소 규칙으로 만든 링크를 실제로 쓸지.**
    # 지금은 꺼 두어 도서관 이름을 누르면 그 도서관 홈페이지로 갑니다. 규칙 307줄이 실제
    # OPAC 에서 검증되지 않아 정확도를 믿을 수 없어서입니다. 틀린 규칙은 HTTP 200 을 주면서
    # 결과만 0건이라, 사용자에게는 「소장한다더니 그 책이 없네」로 보이고 소장 정보 자체를
    # 믿지 않게 됩니다. 깨진 링크는 눈에 보이지만 이것은 보이지 않습니다.
    # **규칙 표(opac/templates.csv)와 상세 패턴은 그대로 읽습니다.** 보완의 기반이고,
    # /api/diagnose/opac 이 스위치를 건너뛰어 배포된 서버에서 한 줄씩 확인해 줍니다.
    # 확인이 끝난 뒤에 켜면 됩니다.
    #   WIMB_OPAC_LINKS_ENABLED=true
    links-enabled: false
  holdings:
    # 소장 캐시 스냅샷을 두는 곳. **컨테이너 안에 두면 재배포 때 함께 사라집니다.**
    # 이미지가 WIMB_HOLDINGS_CACHE_PATH=/data/... 로 덮고, 배포 스크립트가 거기에
    # 볼륨을 붙입니다. 아래 값은 로컬에서 개발할 때 쓰는 상대 경로입니다.
    cache-path: data/holding-cache.tsv.gz
    # 종료 훅만으로는 부족해서 주기적으로도 저장합니다. 배포 스크립트가 컨테이너를
    # 바꿀 때 쓰는 docker rm -f 는 SIGKILL 이라 종료 훅이 돌 기회가 없습니다.
    save-interval-ms: 60000
  rate-limit:
    # **주소 하나가 하루 몫을 통째로 태우지 못하게 막습니다.**
    # 우리 API 는 인증이 없고 주소는 번들에 박혀 있어 감출 수 없습니다. 감추는 것이 아니라
    # 몫을 정해 두는 것이 답입니다. 단위는 요청 수가 아니라 **무게**인데, 요청마다 정보나루를
    # 부르는 횟수가 크게 다르기 때문입니다. 무게표는 RateLimitInterceptor.costOf 에 있습니다.
    enabled: true
    # **프록시 뒤인지.** 지금 배포는 Caddy 뒤라 참입니다. 프록시 없이 포트를 직접 여는
    # 개발 환경에서는 X-Forwarded-For 자체가 오지 않으므로 참이어도 문제가 없습니다.
    # 거짓으로 두고 프록시 뒤에 놓으면 모든 사용자가 프록시 주소 하나로 뭉뚱그려집니다.
    behind-proxy: true
    # 한 권 검색 한 번이 대략 88(검색 8 + 소장 20×4)입니다. 화면이 소장 조회를 여덟 개씩
    # 겹쳐 보내므로 burst 를 분당 한도보다 넉넉히 둡니다.
    per-minute: 400
    burst: 800
    # 하루 예산 25,000 의 20% 입니다. 한 주소가 하루치를 다 가져가지 못하게 하면서,
    # 실제 사용자가 하루에 열몇 번씩 확인해도 걸리지 않는 선입니다.
    per-day: 5000
    # 기억해 둘 주소의 수. 메모리 1GB 기계라 자라는 대로 두면 안 됩니다.
    max-tracked-clients: 20000
  cors:
    # 로컬 개발용 기본값입니다. 배포할 때는 환경 변수로 덮습니다.
    #   WIMB_CORS_ALLOWED_ORIGINS=https://where-is-my-book.vercel.app
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173

logging:
  level:
    kr.wimb: INFO
